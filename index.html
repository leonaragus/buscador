<!doctype html>

  <head>
    <script id="suppress-vite-hmr-errors">
      (function() {
        // 1. Suppress console.error for benign Vite HMR WebSocket closing in cloud proxy
        try {
          const originalConsoleError = console.error;
          console.error = function(...args) {
            const text = args.map(function(a) {
              return (a instanceof Error ? a.message : String(a || ''));
            }).join(' ');
            if (text.includes('WebSocket closed without opened') || text.includes('WebSocket')) {
              return;
            }
            return originalConsoleError.apply(console, args);
          };
        } catch (e) {}

        // 2. Mock/Stub window.WebSocket when invoked by Vite HMR client
        try {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              const isViteHmr = (protocols === 'vite-hmr') || 
                                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                                (typeof url === 'string' && (url.includes('ais-dev') || url.includes('@vite')));
              if (isViteHmr) {
                // Return safe inert WebSocket mock
                const fake = {
                  readyState: 3,
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: url,
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  close: function() {},
                  send: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; }
                };
                return fake;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        // 3. Catch window error events
        window.addEventListener('error', function(event) {
          const msg = event?.message || (event?.error && event.error.message) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('closed without opened'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const msg = event?.reason?.message || String(event?.reason || '');
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('closed without opened'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <script id="patch-fetch-setter">
      (function() {
        try {
          let currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() { return currentFetch; },
            set(v) { currentFetch = v; }
          });
        } catch (e) {
          console.warn("Could not redefine web view fetch property descriptor:", e);
        }
      })();
    </script>
