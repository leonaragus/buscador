<!doctype html>
<html lang="en">
  <head>
    <script id="patch-fetch-setter">
      (function() {
        try {
          let currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() { return currentFetch; },
            set(v) { currentFetch = v; }
          });
        } catch (e) {
          console.warn("Could not redefine web view fetch property descriptor:", e);
        }
      })();
    </script>
